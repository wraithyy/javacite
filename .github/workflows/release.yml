name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and publishToMavenLocal only; skip every remote publish step"
        type: boolean
        default: true
      version:
        description: "Version for a manual run (a tag push derives it from the tag)"
        type: string
        default: "0.0.0-dryrun"

concurrency:
  group: release
  cancel-in-progress: false

# Least privilege by default; the job below grants what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Approval gate for the remote publish steps (configure required reviewers on the "release" environment).
    environment: release
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      # A tag-pinned `jbang javacite@wraithyy/javacite/vX.Y.Z` reads the catalog from the tag itself, so the tagged
      # commit must already carry this release's GAV.
      - name: Check JBang catalog matches the tag
        if: github.ref_type == 'tag'
        run: grep -q "\"io.github.wraithyy:javacite-cli:$VERSION\"" jbang-catalog.json || { echo "jbang-catalog.json does not point at javacite-cli:$VERSION; bump it before tagging" >&2; exit 1; }

      - name: Check release secrets
        if: github.ref_type == 'tag' && !inputs.dry_run
        run: |
          missing=0
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD GRADLE_PUBLISH_KEY GRADLE_PUBLISH_SECRET; do
            if [ -z "${!name}" ]; then echo "Missing secret: $name" >&2; missing=1; fi
          done
          exit "$missing"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set Maven plugin version
        run: mvn -B -q -f javacite-maven/pom.xml versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew -Pversion="$VERSION" build

      - name: Publish to mavenLocal
        run: ./gradlew -Pversion="$VERSION" publishToMavenLocal

      - name: Publish Gradle modules to Maven Central
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        # Uploads a deployment that waits for a manual Publish in the Central Portal.
        # Use publishAndReleaseToMavenCentral instead to release without the click.
        run: ./gradlew -Pversion="$VERSION" -Pjavacite.release=true publishToMavenCentral

      - name: Deploy Maven plugin to Maven Central
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: mvn -B -f javacite-maven/pom.xml -P release -DskipTests deploy

      - name: Publish Gradle plugin to the Plugin Portal
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -Pversion="$VERSION" :javacite-gradle-plugin:publishPlugins

      - name: Create GitHub release
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "javacite-cli/build/libs/javacite-cli-$VERSION.jar" --verify-tag --title "$TAG" --generate-notes
