[versions]
# Build-time stack (verified on Maven Central / Plugin Portal, 2026-10-08)
spotless-gradle = "8.10.3"
spotless-maven = "3.10.3"
palantir-java-format = "2.102.0"
errorprone-gradle = "5.1.1"
errorprone-core = "2.50.0"
nullaway = "0.14.2"
jspecify = "1.0.1"
pmd = "7.28.0"
pmd-maven = "3.28.0"
jacoco = "0.8.15"
archunit = "1.5.1"
dependency-check = "13.0.0"
enforcer-maven = "3.6.3"
snakeyaml-engine = "3.2"
picocli = "4.7.7"
plugin-publish = "2.2.1"
maven-plugin-tools = "3.16.0"
maven-core = "3.9.16"
junit = "6.1.3"
assertj = "3.27.3"

[libraries]
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
pmd-java = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
# Third-party Gradle plugins applied programmatically by javacite-gradle-plugin
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless-gradle" }
errorprone-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-gradle" }
dependency-check-plugin = { module = "org.owasp:dependency-check-gradle", version.ref = "dependency-check" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
